<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Responsivo</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#ffe5ec;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login{
    width:90%;
    max-width:400px;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
}

.login h1{
    text-align:center;
    margin-bottom:20px;
}

form{
    display:flex;
    flex-direction:column;
    gap:15px;
}

input{
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    padding:12px;
    background:#ff8fa3;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#ff758f;
}

</style>
</head>

<body>

<div class="login">

<h1>Entrar</h1>

<form>

<input type="email" placeholder="E-mail">

<input type="password" placeholder="Senha">

<button type="submit">Login</button>

</form>

</div>

</body>
</html>
