<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro de Usuário</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background-color:#f4f4f4;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .container{
        background:white;
        padding:30px;
        width:400px;
        border-radius:10px;
        box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h1{
        text-align:center;
        margin-bottom:20px;
    }

    label{
        display:block;
        margin-top:10px;
    }

    input{
        width:100%;
        padding:10px;
        margin-top:5px;
        border:1px solid #ccc;
        border-radius:5px;
    }

    button{
        width:100%;
        margin-top:20px;
        padding:12px;
        background:#ff8fa3;
        color:white;
        border:none;
        border-radius:5px;
        cursor:pointer;
    }

    button:hover{
        background:#ff758f;
    }
</style>
</head>

<body>

<div class="container">
    <h1>Cadastro</h1>

    <form>
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome">

        <label for="email">E-mail</label>
        <input type="email" id="email">

        <label for="senha">Senha</label>
        <input type="password" id="senha">

        <button type="submit">Cadastrar</button>
    </form>
</div>

</body>
</html>
