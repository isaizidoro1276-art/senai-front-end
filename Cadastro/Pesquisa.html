<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pesquisa</title>

<style>

body{
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f5f5f5;
}

.pesquisa{
    display:flex;
    gap:10px;
}

input{
    width:300px;
    padding:12px;
    border:1px solid #ccc;
    border-radius:25px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:25px;
    background:#ff8fa3;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#ff758f;
}

</style>
</head>

<body>

<form class="pesquisa">

<input
type="search"
placeholder="Pesquisar produtos...">

<button type="submit">
Pesquisar
</button>

</form>

</body>
</html>
