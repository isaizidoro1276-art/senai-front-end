<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Responsivo</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f4f4;
            padding:20px;
        }

        h1{
            text-align:center;
            margin-bottom:20px;
        }

        .container{
            display:flex;
            gap:20px;
        }

        .card{
            flex:1;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }

        @media (max-width:768px){

            .container{
                flex-direction:column;
            }

        }

    </style>

</head>
<body>

    <h1>Layout Responsivo</h1>

    <div class="container">

        <div class="card">
            <h2>HTML</h2>
            <p>Estrutura da página.</p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>Estilização da página.</p>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>Interatividade da página.</p>
        </div>

    </div>

</body>
</html>
