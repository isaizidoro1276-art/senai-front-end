<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 3 - Figure e Figcaption</title>
</head>

<body>

    <h1>Paisagem Natural</h1>

    <figure>
        <img src="https://picsum.photos/600/400" alt="Paisagem natural">

        <figcaption>
            Figura 1 - Exemplo de imagem utilizando as tags
            &lt;figure&gt; e &lt;figcaption&gt;.
        </figcaption>
    </figure>

</body>

</html>
