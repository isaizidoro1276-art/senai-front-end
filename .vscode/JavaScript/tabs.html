<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Tabs</title>

<style>

body{
    font-family:Arial;
}

button{
    padding:10px 20px;
    margin:5px;
}

.conteudo{
    display:none;
    margin-top:20px;
}

</style>

</head>

<body>

<h1>Sistema de Abas</h1>

<button onclick="mostrar('html')">HTML</button>
<button onclick="mostrar('css')">CSS</button>
<button onclick="mostrar('js')">JavaScript</button>

<div id="html" class="conteudo">
    <h2>HTML</h2>
    <p>Linguagem de marcação.</p>
</div>

<div id="css" class="conteudo">
    <h2>CSS</h2>
    <p>Folha de estilos.</p>
</div>

<div id="js" class="conteudo">
    <h2>JavaScript</h2>
    <p>Linguagem de programação.</p>
</div>

<script>

function mostrar(id){

    let conteudos =
    document.querySelectorAll(".conteudo");

    conteudos.forEach(function(item){
        item.style.display = "none";
    });

    document.getElementById(id).style.display =
    "block";

}

</script>

</body>
</html>
