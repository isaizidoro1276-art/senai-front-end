<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Modal</title>

<style>

body{
    font-family:Arial;
    text-align:center;
    margin-top:100px;
}

.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
}

.conteudo{
    background:white;
    width:300px;
    margin:150px auto;
    padding:20px;
    border-radius:10px;
}

button{
    padding:10px 20px;
}

</style>

</head>

<body>

<button onclick="abrirModal()">
Abrir Modal
</button>

<div class="modal" id="modal">

<div class="conteudo">
<h2>Aviso</h2>
<p>Esta é uma mensagem importante.</p>
</div>

</div>

<script>

const modal = document.getElementById("modal");

function abrirModal(){
    modal.style.display = "block";
}

window.onclick = function(event){

    if(event.target == modal){
        modal.style.display = "none";
    }

}

</script>

</body>
</html>
